<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; }
        canvas { width: 500px; height: 500px; outline: none; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        window.renderModel = function(modelUrl) {
            return new Promise((resolve) => {
                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(500, 500);
                renderer.setPixelRatio(2); // High res
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 1.0;
                document.body.appendChild(renderer.domElement);

                const scene = new THREE.Scene();
                
                const frustumSize = 350;
                const camera = new THREE.OrthographicCamera(frustumSize / -2, frustumSize / 2, frustumSize / 2, frustumSize / -2, 0.1, 1500);
                camera.position.set(300, 200, 300);
                camera.lookAt(0, 0, 0);

                const ambient = new THREE.AmbientLight(0xffffff, 0.3);
                scene.add(ambient);

                // Option A: Studio Architectural
                const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
                scene.add(hemiLight);
                
                const keyLight = new THREE.DirectionalLight(0xffffff, 0.8);
                keyLight.position.set(100, 150, 100);
                keyLight.castShadow = true;
                scene.add(keyLight);

                const groundGeo = new THREE.PlaneGeometry(1000, 1000);
                const groundMat = new THREE.ShadowMaterial({ opacity: 0.15 });
                const ground = new THREE.Mesh(groundGeo, groundMat);
                ground.rotation.x = -Math.PI / 2;
                ground.position.y = -80; // Default, will adjust
                ground.receiveShadow = true;
                scene.add(ground);

                const loader = new GLTFLoader();
                loader.load(modelUrl, (gltf) => {
                    const mesh = gltf.scene.children[0];
                    const epsMaterial = new THREE.MeshStandardMaterial({
                        color: 0xF5F3EE,
                        roughness: 0.9,
                        metalness: 0.05,
                        flatShading: false,
                    });

                    if(mesh.isMesh) {
                        mesh.material = epsMaterial;
                        mesh.geometry.computeVertexNormals();
                    } else {
                        mesh.traverse((c) => {
                            if (c.isMesh) {
                                c.material = epsMaterial;
                                c.geometry.computeVertexNormals();
                            }
                        });
                    }

                    scene.add(mesh);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;

                    // Adjust ground
                    const box = new THREE.Box3().setFromObject(mesh);
                    ground.position.y = box.min.y;

                    renderer.render(scene, camera);
                    
                    // Wait a frame for render
                    setTimeout(() => resolve(true), 50);
                });
            });
        };
    </script>
</body>
</html>

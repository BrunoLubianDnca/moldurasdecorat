<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Decorat — comparação M017</title>
  <style>
    :root { color: #173d52; background: #f2efe8; font-family: Arial, sans-serif; }
    body { max-width: 1180px; margin: 0 auto; padding: 32px; }
    h1 { margin: 0 0 8px; font-size: 32px; }
    p { color: #64727a; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 24px; }
    figure { margin: 0; padding: 14px; background: #fffdf8; border: 1px solid #ddd6cb; border-radius: 16px; }
    img { display: block; width: 100%; height: 340px; object-fit: contain; background: #f6f3ed; border-radius: 10px; }
    figcaption { padding: 12px 4px 2px; font-weight: 700; }
    small { display: block; margin-top: 4px; color: #75818a; font-weight: 400; }
    @media (max-width: 720px) { body { padding: 18px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>M017 · reconstrução 3D</h1>
  <p>Comparação dos arquivos disponíveis no workspace. A peça nova e o GLB interativo usam a mesma malha mestre.</p>
  <main class="grid">
    <figure><img src="/catalogo/produtos/M017_fixed.webp" alt="Render antigo do M017"><figcaption>Modelo antigo<small>Preview gerado pelo pipeline anterior</small></figcaption></figure>
    <figure><img src="/catalogo/produtos/M017_hero.png" alt="Render hero novo do M017"><figcaption>Novo render hero<small>Perfil limpo, orientação decorativa e material off-white</small></figcaption></figure>
    <figure><img src="/catalogo/perfis/M017.svg" alt="Perfil SVG do M017"><figcaption>Perfil SVG auditável<small>Envelope nominal: 61 × 171</small></figcaption></figure>
    <figure><img src="/catalogo/originais/M017.jpg" alt="Ficha de referência original do M017"><figcaption>Referência original<small>Ficha M17 disponível no workspace</small></figcaption></figure>
  </main>
</body>
</html>
